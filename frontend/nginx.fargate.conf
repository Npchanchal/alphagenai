# Combined-task nginx: SPA + reverse-proxy to API on localhost (same Fargate ENI).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  charset utf-8;
  charset_types text/css text/plain text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/atom+xml
    application/manifest+json
    image/svg+xml;

  # Security headers on static + SPA (API routes add their own via FastAPI middleware)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://plausible.io; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://plausible.io; frame-src https://www.googletagmanager.com" always;

  # ALB sits in the VPC: resolve $remote_addr to the visitor so the API rate-limits per visitor.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  if ($uri ~ ^(.+)/$) {
    return 301 https://$host$1$is_args$args;
  }

  # The file behind /path is /path/index.html. A direct request must 301 to /path
  # so Google does not keep it as an alternate with a different canonical.
  location = /index.html {
    return 301 https://$host/$is_args$args;
  }
  location ~ ^(.+)/index\.html$ {
    return 301 https://$host$1$is_args$args;
  }

  # Products, Package and Tier features merged into /products (2026-10-17).
  location = /package { absolute_redirect off; return 301 /products#plans; }
  location = /about/tiers { absolute_redirect off; return 301 /products#features; }
  location = /sights/search { absolute_redirect off; return 301 /research?scope=all; }
  location = /sights/ask { absolute_redirect off; return 301 /research?tab=chat&scope=all; }
  location = /sights/boards { absolute_redirect off; return 301 /research?tab=watch; }
  location = /sights/agents { absolute_redirect off; return 301 /analyst; }
  location = /sights/export { absolute_redirect off; return 301 /analyst; }

  location = /site.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /llms.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /llms-full.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /ai.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  location ~ ^/c17e41fa2026a1b2c3d4e5f60718\.txt$ {
    default_type text/plain;
    try_files $uri =404;
  }

  location = /sitemap-images.xml {
    try_files $uri =404;
  }

  location = /rss.xml {
    default_type application/rss+xml;
    try_files $uri =404;
  }

  location = /.well-known/security.txt {
    default_type text/plain;
    try_files $uri =404;
  }

  # Lighthouse reads this path. Without an exact file it receives the SPA shell and fails the catalog schema.
  location = /.well-known/ai-catalog.json {
    default_type application/json;
    try_files /.well-known/ai-catalog.json =404;
  }

  location = /.well-known/ard.json {
    default_type application/json;
    try_files /.well-known/ai-catalog.json =404;
  }

  # /robots.xml is not a sitemap. The SPA shell is HTML, which Search Console
  # reports as "Sitemap is HTML". ALB terminates TLS, so $scheme is http.
  location = /robots.xml {
    return 301 https://$host/sitemap.xml;
  }

  location = /robots.txt {
    expires epoch;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    expires epoch;
    default_type application/xml;
    try_files $uri =404;
  }

  # Any other missing XML file must 404. Falling through to app-shell.html is a 200 HTML page.
  location ~* \.xml$ {
    expires epoch;
    default_type application/xml;
    try_files $uri =404;
  }

  # Analyst Project uploads (10 MB file ≈ 14 MB base64 JSON) and house-style logo / deck template.
  location ~ ^/api/analyst/(projects/[^/]+/uploads|house-style(/template)?)$ {
    client_max_body_size 15m;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /health {
    proxy_pass http://127.0.0.1:8000/health;
  }

  location /docs {
    proxy_pass http://127.0.0.1:8000/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /openapi.json {
    proxy_pass http://127.0.0.1:8000/openapi.json;
  }

  location /redoc {
    proxy_pass http://127.0.0.1:8000/redoc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # HTML must revalidate: it names hashed /assets bundles that disappear on the next deploy.
  # `expires` (not add_header) keeps the server-level security headers inherited.
  location = / {
    expires epoch;
    try_files /index.html =404;
  }

  location / {
    expires epoch;
    try_files $uri $uri/index.html /app-shell.html;
  }

  include /etc/nginx/snippets/static-cache.conf;
}
