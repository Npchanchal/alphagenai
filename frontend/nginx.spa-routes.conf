# First path segment of every client route in src/App.tsx. A path outside this list is a real 404,
# not the app shell with status 200 (search engines report that as a soft 404).
# backend/tests/test_seo_crawl_surface.py keeps this list in step with App.tsx.
map $uri $spa_route {
  default 0;
  ~^/(404|about|accept-invite|account|admin|analyst|answers|billing|blog|c|changelog|companies|desk|developers|forgot-password|help|holdings|login|methodology|ninja|org|package|pilot|press|privacy|products|rankings|register|research|reset-password|sights|status|terms|tracker|trust|verify-email|workflows)(/|$) 1;
}
